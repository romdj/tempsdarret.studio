# SonarQube Cloud configuration for the tempsdarret.studio monorepo.
# Requires a SONAR_TOKEN repo secret (Settings → Secrets and variables →
# Actions) pointing at a project created on sonarcloud.io under your org.
# See .github/workflows/ci.yml's `code-quality-sonar` job for the CI wiring.

sonar.projectKey=romdj_tempsdarret.studio
sonar.organization=romdj

# api-gateway and packages/models are deliberately excluded: neither has a
# src/ directory or any TypeScript to analyze yet - api-gateway's own
# lint/check scripts literally say "No source files to lint/check yet",
# and packages/models is TypeSpec (.tsp) only. Pointing sonar.sources at a
# path that doesn't exist on disk hard-fails the scan (CI run 2026-09-06:
# "The folder 'api-gateway/src' does not exist").
sonar.sources=frontend/src,packages/shared/src,services/user-service/src,services/invitation-service/src,services/portfolio-service/src,services/shoot-service/src,services/file-service/src,services/notification-service/src

# Test file locations aren't consistent across the monorepo (services use
# tests/, packages/shared has both test/ and tests/, frontend colocates
# *.test.ts next to the component in src/) - rather than hand-enumerate
# each package's actual test directory name, point sonar.tests at the same
# package roots as sonar.sources (overlap with sonar.sources is expected
# and standard for colocated-test setups) and let sonar.test.inclusions'
# filename glob do the classification.
sonar.tests=frontend/src,packages/shared,services/user-service,services/invitation-service,services/portfolio-service,services/shoot-service,services/file-service,services/notification-service
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.svelte,**/*.spec.svelte
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.svelte-kit/**,**/coverage/**

# Merge v8 coverage output (lcov) from each package/service once produced by
# `pnpm run test:coverage`. Paths are relative to each package's own root,
# so this needs a wildcard per workspace member. api-gateway/models omitted
# - neither produces a vitest coverage report.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,packages/shared/coverage/lcov.info,services/user-service/coverage/lcov.info,services/invitation-service/coverage/lcov.info,services/portfolio-service/coverage/lcov.info,services/shoot-service/coverage/lcov.info,services/file-service/coverage/lcov.info,services/notification-service/coverage/lcov.info

# Block the scan step itself once the quality gate is red, so a failing
# gate shows up as a failed GitHub Actions job without a second action.
sonar.qualitygate.wait=true
