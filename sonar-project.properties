# SonarQube Cloud configuration for the tempsdarret.studio monorepo.
# Requires a SONAR_TOKEN repo secret (Settings → Secrets and variables →
# Actions) pointing at a project created on sonarcloud.io under your org.
# See .github/workflows/ci.yml's `code-quality-sonar` job for the CI wiring.

sonar.projectKey=romdj_tempsdarret.studio
sonar.organization=romdj

sonar.sources=frontend/src,api-gateway/src,packages/models/src,packages/shared/src,services/user-service/src,services/invitation-service/src,services/portfolio-service/src,services/shoot-service/src,services/file-service/src,services/notification-service/src
sonar.tests=frontend/src,api-gateway/src,packages/models/src,packages/shared/src,services/user-service,services/invitation-service,services/portfolio-service,services/shoot-service,services/file-service,services/notification-service
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.svelte,**/*.spec.svelte
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.svelte-kit/**,**/coverage/**

# Merge v8 coverage output (lcov) from each package/service once produced by
# `pnpm run test:coverage`. Paths are relative to each package's own root,
# so this needs a wildcard per workspace member.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,api-gateway/coverage/lcov.info,packages/models/coverage/lcov.info,packages/shared/coverage/lcov.info,services/user-service/coverage/lcov.info,services/invitation-service/coverage/lcov.info,services/portfolio-service/coverage/lcov.info,services/shoot-service/coverage/lcov.info,services/file-service/coverage/lcov.info,services/notification-service/coverage/lcov.info

# Block the scan step itself once the quality gate is red, so a failing
# gate shows up as a failed GitHub Actions job without a second action.
sonar.qualitygate.wait=true
