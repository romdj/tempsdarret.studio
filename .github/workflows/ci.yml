# Temps D'arrêt - Unified CI/CD Pipeline
# Comprehensive build, test, and quality checks
name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feat/*', 'fix/*', 'hotfix/*']
  pull_request:
    branches: [main]

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 📋 QUALITY CHECKS (Fast - runs first)
  # ==========================================================================

  quality-checks:
    name: 🔍 Quality • Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all services
        run: pnpm run lint

      - name: Build shared packages
        run: pnpm run build:models && pnpm run build:shared

      - name: Type check all services
        run: pnpm run check

      - name: Check for circular dependencies
        run: npx madge --circular services/ --extensions ts || echo "No circular deps"
        continue-on-error: true

  # ==========================================================================
  # 🏗️ BUILD & UNIT TESTS (Parallel by component)
  # ==========================================================================

  build-and-unit-test:
    name: 🏗️ Build & Unit • ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        component:
          - models
          - shared
          - user-service
          - invitation-service
          - portfolio-service
          - shoot-service
          - file-service
          - notification-service
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared dependencies
        if: ${{ !contains(fromJson('["models", "shared"]'), matrix.component) }}
        run: pnpm run build:models && pnpm run build:shared

      - name: Build ${{ matrix.component }}
        run: pnpm run build:${{ matrix.component }}

      - name: Run unit tests
        run: |
          if [ "${{ matrix.component }}" = "models" ] || [ "${{ matrix.component }}" = "shared" ]; then
            cd packages/${{ matrix.component }} && pnpm run test:unit || echo "No unit tests for ${{ matrix.component }}"
          elif [ "${{ matrix.component }}" = "frontend" ]; then
            cd frontend && pnpm run test:unit || echo "No unit tests for frontend"
          else
            cd services/${{ matrix.component }} && pnpm run test:unit
          fi
        env:
          NODE_ENV: test

      - name: Cache build artifacts
        uses: actions/cache/save@v5
        with:
          path: |
            services/${{ matrix.component }}/dist
            packages/${{ matrix.component }}/dist
            frontend/build
          key: build-${{ matrix.component }}-${{ github.sha }}

  # ==========================================================================
  # 🧪 COMPONENT TESTS (With Docker services)
  # ==========================================================================

  component-tests:
    name: 🧪 Component • ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - invitation-service
          - portfolio-service
          - shoot-service
          - file-service
          - notification-service

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run component tests
        run: cd services/${{ matrix.service }} && pnpm run test:component
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://test:test@localhost:27017/${{ matrix.service }}-test?authSource=admin
          MONGO_TEST_BASE_URI: mongodb://test:test@localhost:27017
          KAFKA_BROKERS: localhost:9092
          REDIS_URL: redis://localhost:6379/0


  # ==========================================================================
  # 🔗 INTEGRATION TESTS (With Docker services)
  # ==========================================================================

  integration-tests:
    name: 🔗 Integration • ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - invitation-service
          - portfolio-service
          - shoot-service
          - file-service
          - notification-service

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: cd services/${{ matrix.service }} && pnpm run test:integration
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://test:test@localhost:27017/${{ matrix.service }}-integration?authSource=admin
          MONGO_TEST_BASE_URI: mongodb://test:test@localhost:27017
          KAFKA_BROKERS: localhost:9092
          REDIS_URL: redis://localhost:6379/1


  # ==========================================================================
  # 📜 CONTRACT TESTS
  # ==========================================================================

  contract-tests:
    name: 📜 Contract • ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - invitation-service
          - portfolio-service
          - shoot-service
          - file-service
          - notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: cd services/${{ matrix.service }} && pnpm run test:contract
        env:
          NODE_ENV: test


  # ==========================================================================
  # 🎬 END-TO-END TESTS (In-process event flows)
  # ==========================================================================

  e2e-tests:
    name: 🎬 E2E • In-Process Flows
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run in-process E2E flows
        run: cd services/common/tests && pnpm run test:e2e:inprocess
        env:
          NODE_ENV: test
          E2E_MONGO_URI: mongodb://test:test@localhost:27017/tempsdarret-e2e?authSource=admin
          E2E_KAFKA_BROKERS: localhost:9092


  # ==========================================================================
  # 📊 CODE COVERAGE (Aggregated)
  # Runs alongside component/integration/contract/e2e — it re-executes each
  # service's own test:coverage rather than reusing their results, so it
  # doesn't need to wait for them; only needs the build.
  # ==========================================================================

  coverage:
    name: 📊 Coverage • All Services
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage for all services
        # No `|| echo` masking and no job-level continue-on-error: a failing
        # coverage run (crash, or a per-service `coverage.thresholds` floor
        # not met) now fails this job for real. See docs/adr for the
        # currently-configured floors — they're a deliberately conservative
        # starting ratchet, not a target.
        run: |
          set -e
          for service in user-service invitation-service portfolio-service shoot-service file-service notification-service; do
            echo "Running coverage for $service..."
            (cd services/$service && pnpm run test:coverage)
          done
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://test:test@localhost:27017/coverage-test?authSource=admin
          REDIS_URL: redis://localhost:6379/2

  # ==========================================================================
  # 🔒 SECURITY & DEPENDENCY AUDIT
  # Lockfile-based, doesn't need test results — runs alongside
  # component/integration/contract/e2e, SAST, DAST, and code-quality.
  # ==========================================================================

  security-audit:
    name: 🔒 Security • Audit & Vulnerabilities
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # Blocking: a moderate-or-higher vulnerability now fails the job.
        # If a transitive dep has no fix available yet, add it to a
        # documented allowlist (e.g. via `pnpm audit --audit-level=moderate
        # --ignore-cves ...` or an audit-ci config) rather than reintroducing
        # continue-on-error.
        run: pnpm audit --audit-level=moderate

      - name: Check for outdated dependencies
        run: pnpm outdated || echo "Some dependencies are outdated"
        continue-on-error: true

  # ==========================================================================
  # 🛡️ SAST — Static Application Security Testing (CodeQL)
  # Pure source analysis, no test dependency — runs alongside
  # component/integration/contract/e2e, coverage, security-audit, DAST, and
  # code-quality.
  # ==========================================================================

  sast-codeql:
    name: 🛡️ SAST • CodeQL
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  # ==========================================================================
  # 🕷️ DAST — Dynamic Application Security Testing (OWASP ZAP baseline)
  # Scans the built static frontend (the artifact that actually ships to S3),
  # not raw source — DAST needs a running target, so this job builds the
  # SvelteKit static output and serves it locally before scanning.
  # ==========================================================================

  dast-zap:
    name: 🕷️ DAST • ZAP Baseline
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Serve built frontend
        working-directory: frontend
        run: |
          nohup pnpm run preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server never became ready:"; cat /tmp/preview.log; exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:4173/'
          fail_action: true
          allow_issue_writing: false
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  # ==========================================================================
  # 📈 CODE QUALITY — SonarQube Cloud
  # Runs alongside component/integration/contract/e2e, coverage,
  # security-audit, and DAST — not after them.
  #
  # ⚠️ This job runs on its own fresh checkout and does NOT download the
  # `coverage` job's lcov output (no artifact upload/download wired between
  # them), so sonar-project.properties' coverage report paths currently
  # resolve to nothing — Sonar will report with no coverage data merged in
  # until that artifact wiring is added as follow-up work.
  #
  # SONAR_TOKEN is set (2026-09-02) and this is now required by ci-success.
  # ==========================================================================

  code-quality-sonar:
    name: 📈 Code Quality • SonarQube Cloud
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (for accurate analysis)
        run: pnpm run build:models && pnpm run build:shared

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================================================
  # ✅ FINAL STATUS (Required checks summary)
  # ==========================================================================

  ci-success:
    name: ✅ CI Pipeline • Status
    runs-on: ubuntu-latest
    needs:
      - quality-checks
      - build-and-unit-test
      - component-tests
      - integration-tests
      - contract-tests
      - e2e-tests
      - coverage
      - security-audit
      - sast-codeql
      - dast-zap
      - code-quality-sonar
    if: always()

    steps:
      - name: Check pipeline status
        run: |
          echo "========================================="
          echo "CI/CD Pipeline Summary"
          echo "========================================="
          echo "Quality Checks: ${{ needs.quality-checks.result }}"
          echo "Build & Unit Tests: ${{ needs.build-and-unit-test.result }}"
          echo "Component Tests: ${{ needs.component-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Contract Tests: ${{ needs.contract-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "SAST (CodeQL): ${{ needs.sast-codeql.result }}"
          echo "DAST (ZAP): ${{ needs.dast-zap.result }}"
          echo "Code Quality (SonarQube Cloud): ${{ needs.code-quality-sonar.result }}"
          echo "========================================="

          # Fail if any critical job failed
          if [ "${{ needs.quality-checks.result }}" != "success" ]; then
            echo "❌ Quality checks failed"
            exit 1
          fi
          if [ "${{ needs.build-and-unit-test.result }}" != "success" ]; then
            echo "❌ Build & unit tests failed"
            exit 1
          fi
          if [ "${{ needs.component-tests.result }}" != "success" ]; then
            echo "❌ Component tests failed"
            exit 1
          fi
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "❌ Integration tests failed"
            exit 1
          fi
          if [ "${{ needs.contract-tests.result }}" != "success" ]; then
            echo "❌ Contract tests failed"
            exit 1
          fi
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "❌ Coverage checks failed"
            exit 1
          fi
          if [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ Security audit failed"
            exit 1
          fi
          if [ "${{ needs.sast-codeql.result }}" != "success" ]; then
            echo "❌ SAST (CodeQL) failed"
            exit 1
          fi
          if [ "${{ needs.dast-zap.result }}" != "success" ]; then
            echo "❌ DAST (ZAP baseline) failed"
            exit 1
          fi
          if [ "${{ needs.code-quality-sonar.result }}" != "success" ]; then
            echo "❌ Code quality (SonarQube Cloud) failed"
            exit 1
          fi

          echo "✅ All critical checks passed!"

  # ==========================================================================
  # 🚀 DEPLOYMENT READINESS (Only on main)
  # ==========================================================================

  deployment-ready:
    name: 🚀 Ready for Deployment
    runs-on: ubuntu-latest
    needs: ci-success
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment readiness check
        run: |
          echo "✅ All checks passed - Ready for deployment"
          echo "📦 Services built and tested"
          echo "🐳 Docker images ready"
          echo "🔒 Security audit complete"
          echo ""
          echo "Next steps:"
          echo "  - Deploy to staging: manual trigger"
          echo "  - Deploy to production: manual approval required"
